[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-saas-bot"
version = "1.0.0"
description = "Commercial Telegram VPN SaaS bot with FastAPI, aiogram, PostgreSQL, Redis and Celery."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.20.0,<4.0.0",
    "alembic>=1.16.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "celery[redis]>=5.5.0,<6.0.0",
    "cryptography>=45.0.0,<46.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "greenlet>=3.2.0,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pillow>=11.0.0,<12.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "qrcode>=8.0.0,<9.0.0",
    "redis>=6.0.0,<7.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.urls]
Repository = "https://github.com/grishique/bot-vpn"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed", "assets/*.png"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
